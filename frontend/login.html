<!DOCTYPE html>

<html lang="zh">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SkillOS — 登录</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=11">

  <style>

    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg-chrome)}

    .login-wrap{width:100%;max-width:360px;position:relative;z-index:1}

    .login-card{padding:32px 28px;background:var(--bg-content);border:1px solid var(--border);border-radius:var(--r-lg);text-align:left;box-shadow:none}

    .login-logo{display:none}

    .login-card .tag{font:500 var(--t-xs)/1 var(--mono);color:var(--text3);letter-spacing:.04em;margin-bottom:8px;text-transform:none}

    .login-card h1{font:600 var(--t-xl)/1.2 var(--font-display);letter-spacing:-.03em;margin-bottom:6px;color:var(--text);background:none;-webkit-text-fill-color:unset}

    .login-card p{font:400 var(--t-sm)/1.5 var(--font);color:var(--text2);margin-bottom:24px;max-width:none}

    .login-card input{width:100%;background:rgba(var(--text-rgb),.04);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-size:var(--t-sm);outline:none;margin-bottom:8px;font-family:var(--font)}

    .login-card input:focus{border-color:rgba(var(--text-rgb),.22);box-shadow:none}

    .login-card button{width:100%;padding:10px;font:500 var(--t-sm)/1 var(--font);border:none;border-radius:var(--r-sm);cursor:pointer;margin-bottom:8px;font-family:var(--font)}

    .login-card .btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:none}

    .login-card .btn-primary:hover{background:var(--accent-light);transform:none;box-shadow:none}.login-card .btn-primary:disabled{opacity:.5;cursor:wait}

    .login-card .btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border)}

    .login-card .btn-secondary:hover{border-color:var(--border2);color:var(--text);background:rgba(var(--text-rgb),.07)}

    .login-card .error{font:400 var(--t-sm)/1.4 var(--font);color:var(--red);margin-top:8px;min-height:18px}

    .login-card .hint{font:400 var(--t-xs)/1.5 var(--font);color:var(--text3);margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

  </style>

</head>

<body>

  <div class="ambient-bg" aria-hidden="true"></div>

  <div class="login-wrap">

    <div class="login-card">

      <div class="login-logo"><span data-icon="hammer"></span></div>

      <div class="tag">SkillOS</div>

      <h1>登录</h1>

      <p>学徒 IDE · 双门禁出师 · 装进 Cursor</p>

      <input id="user" placeholder="用户名" autocomplete="username" autofocus>

      <input id="pass" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">

      <button class="btn-primary" onclick="doLogin()">登录</button>

      <button class="btn-secondary" onclick="doRegister()">注册账号</button>

      <div class="error" id="error"></div>

      <div class="hint">首次使用？输入用户名和密码后点击「注册账号」。<br>Closed Alpha：需本机配置 DEEPSEEK_API_KEY 或登录后启用 BYOK。</div>

    </div>

  </div>



  <script src="/storage-keys.js"></script>

  <script src="/icons.js"></script>

  <script>

    function saveSession(d) {

      if (d.token) localStorage.setItem(StorageKeys.AUTH_TOKEN, d.token);

      if (d.user && d.user.username) localStorage.setItem(StorageKeys.USER, d.user.username);

      if (d.workspace) localStorage.setItem(StorageKeys.WORKSPACE, JSON.stringify(d.workspace));

    }



    async function doLogin() {

      var u = document.getElementById('user').value.trim();

      var p = document.getElementById('pass').value.trim();

      if (!u || !p) return;

      var btns = document.querySelectorAll('.login-card button');

      btns.forEach(function(b){ b.disabled = true; });

      document.getElementById('error').textContent = '';

      try {

        var r = await fetch('/api/auth/login', {

          method: 'POST',

          headers: { 'Content-Type': 'application/json' },

          body: JSON.stringify({ username: u, password: p })

        });

        var d = await r.json();

        if (r.ok && d.token) {

          saveSession(d);

          window.location.href = '/';

        } else {

          document.getElementById('error').textContent = d.detail || d.error || '登录失败';

        }

      } catch (e) {

        document.getElementById('error').textContent = '无法连接服务器';

      }

      btns.forEach(function(b){ b.disabled = false; });

    }



    async function doRegister() {

      var u = document.getElementById('user').value.trim();

      var p = document.getElementById('pass').value.trim();

      if (!u || !p) return;

      if (p.length < 4) {

        document.getElementById('error').textContent = '密码至少 4 位';

        return;

      }

      var btns = document.querySelectorAll('.login-card button');

      btns.forEach(function(b){ b.disabled = true; });

      document.getElementById('error').textContent = '';

      try {

        var r = await fetch('/api/auth/register', {

          method: 'POST',

          headers: { 'Content-Type': 'application/json' },

          body: JSON.stringify({ username: u, password: p, email: '' })

        });

        var d = await r.json();

        if (r.ok && d.token) {

          saveSession(d);

          window.location.href = '/';

        } else {

          document.getElementById('error').textContent = d.detail || d.error || '注册失败';

        }

      } catch (e) {

        document.getElementById('error').textContent = '无法连接服务器';

      }

      btns.forEach(function(b){ b.disabled = false; });

    }



    (function() {

      var token = localStorage.getItem(StorageKeys.AUTH_TOKEN);

      var user = localStorage.getItem(StorageKeys.USER);

      if (token && user && user !== 'anonymous') {

        window.location.replace('/');

        return;

      }

      if (!token) return;

      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })

        .then(function (r) { return r.json(); })

        .then(function (d) {

          if (d.user && d.user.username && d.user.username !== 'anonymous') {

            window.location.href = '/';

          }

        })

        .catch(function () {});

    })();

  </script>

</body>

</html>
